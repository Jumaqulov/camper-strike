<!doctype html>
<!--
  Throwaway viewer for the feral wolf GLBs.
  With the Vite dev server running (npm run dev:client) open:
    http://localhost:5173/scripts/wolf-preview.html            (charcoal coat)
    http://localhost:5173/scripts/wolf-preview.html?coat=red   (red | tan | black | white | lineup)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feral Wolf Preview</title>
<style>
  :root { --bg: #11161a; --panel: #1a2127; --fg: #dfe5ea; --muted: #8b98a3; --line: #2c363f; --accent: #ffb020; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: 1fr 250px; overflow: hidden; }
  #stage { position: relative; min-width: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  h1 { margin: 0; font-size: 18px; }
  h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  select, button { font: inherit; color: var(--fg); background: #0f1418; border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
  select { width: 100%; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type=checkbox], input[type=range] { accent-color: var(--accent); }
  input[type=range] { width: 100%; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-family: ui-monospace, Consolas, monospace; }
  .hint { position: absolute; left: 10px; bottom: 10px; color: var(--muted); font-size: 12px; background: #0009; padding: 4px 8px; border-radius: 4px; pointer-events: none; }
  #err { position: absolute; inset: 0; display: grid; place-items: center; color: #ff8080; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="err"></div>
  <div class="hint">LMB rotate · wheel zoom · RMB pan · space pause</div>
</div>
<aside>
  <h1>Feral Wolf</h1>
  <section>
    <h2>Coat</h2>
    <select id="coat">
      <option value="charcoal">Charcoal grey</option>
      <option value="red">Red</option>
      <option value="tan">Tan</option>
      <option value="black">Black</option>
      <option value="white">Silver white</option>
      <option value="lineup">All five (lineup)</option>
    </select>
  </section>
  <section>
    <h2>Clip</h2>
    <select id="clip"></select>
    <div class="row" style="margin-top:8px">
      <button id="play" type="button">Pause</button>
      <button id="restart" type="button">Restart</button>
      <button id="rest" type="button">Rest pose</button>
    </div>
  </section>
  <section>
    <h2>Speed <span id="speedVal">1.00x</span></h2>
    <input id="speed" type="range" min="0.05" max="2" step="0.05" value="1">
    <h2 style="margin-top:8px">Time</h2>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  </section>
  <section>
    <h2>View</h2>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label><input id="night" type="checkbox"> Night (eye glow)</label>
      <label><input id="skeleton" type="checkbox"> Skeleton</label>
      <label><input id="wire" type="checkbox"> Wireframe</label>
      <label><input id="sockets" type="checkbox"> Sockets</label>
      <label><input id="ref" type="checkbox"> 1.8 m reference capsule</label>
      <label><input id="spin" type="checkbox"> Auto-rotate</label>
    </div>
  </section>
  <section>
    <h2>Info</h2>
    <dl>
      <dt>Triangles</dt><dd id="tris">-</dd>
      <dt>Joints</dt><dd id="joints">-</dd>
      <dt>Size</dt><dd id="size">-</dd>
      <dt>Clip time</dt><dd id="time">-</dd>
    </dl>
  </section>
</aside>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const COAT = params.get('coat') || 'charcoal';
const LINEUP = COAT === 'lineup';
const coatUrl = (c) => `/models/characters/feral_wolf${c === 'charcoal' ? '' : `_${c}`}_rigged.glb?v=${Date.now()}`;
// reference-sheet order, left to right on screen (screen-left is +X when looking down +Z)
const LINEUP_COATS = [['charcoal', 1.7], ['red', 0.85], ['tan', 0], ['black', -0.85], ['white', -1.7]];
const LOOPING = new Set(['Idle', 'Sniff', 'Alert', 'Walk', 'Run']);
const ui = (id) => document.getElementById(id);

const stage = ui('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
if (LINEUP) {
  camera.position.set(0, 0.85, -5.6);
  controls.target.set(0, 0.6, 0);
} else {
  camera.position.set(1.0, 0.75, -2.2);
  controls.target.set(0, 0.62, -0.3);
}

// late-afternoon light: warm key from the front-left, cool sky fill
const hemi = new THREE.HemisphereLight(0xc4d8ff, 0x8a6a45, 1.5);
const sun = new THREE.DirectionalLight(0xffeccf, 3.0);
sun.position.set(-2.5, 3.5, -3.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
scene.add(hemi, sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 48), new THREE.MeshStandardMaterial({ color: 0xb98a58, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(7, 35, 0x8a6e52, 0x9c7d5c);
grid.position.y = 0.002;
scene.add(grid);
const capsule = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 1.3, 6, 16), new THREE.MeshStandardMaterial({ color: 0x3b8f86, roughness: 0.8, transparent: true, opacity: 0.55 }));
capsule.position.set(-0.9, 0.9, 0.3);
capsule.visible = false;
scene.add(capsule);

function setNight(on) {
  scene.background = new THREE.Color(on ? 0x05070b : 0x8fb8e0);
  scene.fog = new THREE.Fog(scene.background, on ? 4 : 12, on ? 18 : 40);
  hemi.intensity = on ? 0.12 : 1.5;
  sun.intensity = on ? 0.08 : 3.0;
}
setNight(false);

const clock = new THREE.Clock();
const wolves = []; // { root, mixer, actions, rest, helper, markers }
let clipName = 'Alert';
let paused = false;

function addWolf(url, x) {
  return new Promise((done, fail) => new GLTFLoader().load(url, (gltf) => {
    const root = gltf.scene;
    root.position.x = x;
    const markers = [];
    root.traverse((o) => {
      if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; }
      if (o.name.startsWith('socket_')) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.015, 10, 8), new THREE.MeshBasicMaterial({ color: 0x00e0ff, depthTest: false }));
        m.renderOrder = 10;
        m.visible = false;
        o.add(m);
        markers.push(m);
      }
    });
    scene.add(root);
    const rest = [];
    root.traverse((o) => { if (o.isBone) rest.push([o, o.position.clone(), o.quaternion.clone()]); });
    const helper = new THREE.SkeletonHelper(root);
    helper.visible = false;
    scene.add(helper);
    const mixer = new THREE.AnimationMixer(root);
    const actions = {};
    for (const clip of gltf.animations) {
      const a = mixer.clipAction(clip);
      const loop = LOOPING.has(clip.name);
      a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
      a.clampWhenFinished = !loop;
      actions[clip.name] = a;
    }
    const w = { root, mixer, actions, rest, helper, markers, clips: gltf.animations };
    wolves.push(w);
    done(w);
  }, undefined, fail));
}

const main = await addWolf(coatUrl(LINEUP ? 'charcoal' : COAT), LINEUP ? LINEUP_COATS[0][1] : 0)
  .catch((e) => { ui('err').textContent = `Failed to load: ${e.message || e}`; throw e; });
for (const clip of main.clips) {
  ui('clip').append(new Option(`${clip.name} (${clip.duration.toFixed(2)} s${LOOPING.has(clip.name) ? ', loop' : ''})`, clip.name));
}
let tris = 0;
main.root.traverse((o) => { if (o.isSkinnedMesh) tris += o.geometry.index.count / 3; });
const size = new THREE.Box3().setFromObject(main.root).getSize(new THREE.Vector3());
ui('tris').textContent = tris;
ui('joints').textContent = main.root.getObjectsByProperty('isSkinnedMesh', true)[0].skeleton.bones.length;
ui('size').textContent = `${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} m`;
play('Alert');
if (LINEUP) {
  for (const [coat, x] of LINEUP_COATS.slice(1)) addWolf(coatUrl(coat), x).then((w) => startClip(w, clipName, 0));
}

function startClip(w, name, fade) {
  const next = w.actions[name];
  if (!next) return;
  if (w.current && w.current !== next) w.current.fadeOut(fade);
  next.reset().fadeIn(w.current ? fade : 0).play();
  next.paused = paused;
  w.current = next;
}
function play(name) {
  clipName = name;
  ui('clip').value = name;
  for (const w of wolves) startClip(w, name, 0.2);
}
function togglePause() {
  paused = !paused;
  for (const w of wolves) if (w.current) w.current.paused = paused;
  ui('play').textContent = paused ? 'Play' : 'Pause';
}
function restPose() {
  for (const w of wolves) {
    w.mixer.stopAllAction();
    w.current = null;
    for (const [bone, pos, quat] of w.rest) {
      bone.position.copy(pos);
      bone.quaternion.copy(quat);
    }
  }
}

ui('coat').value = COAT;
ui('coat').addEventListener('change', (e) => { params.set('coat', e.target.value); location.search = params.toString(); });
ui('clip').addEventListener('change', () => play(ui('clip').value));
ui('restart').addEventListener('click', () => play(ui('clip').value));
ui('rest').addEventListener('click', restPose);
ui('play').addEventListener('click', togglePause);
ui('speed').addEventListener('input', (e) => {
  for (const w of wolves) w.mixer.timeScale = +e.target.value;
  ui('speedVal').textContent = `${(+e.target.value).toFixed(2)}x`;
});
ui('scrub').addEventListener('input', (e) => {
  if (!paused) togglePause();
  for (const w of wolves) if (w.current) {
    w.current.time = +e.target.value * w.current.getClip().duration;
    w.mixer.update(0);
  }
});
ui('night').addEventListener('change', (e) => setNight(e.target.checked));
ui('skeleton').addEventListener('change', (e) => wolves.forEach((w) => { w.helper.visible = e.target.checked; }));
ui('wire').addEventListener('change', (e) => wolves.forEach((w) => w.root.traverse((o) => { if (o.isMesh) o.material.wireframe = e.target.checked; })));
ui('sockets').addEventListener('change', (e) => wolves.forEach((w) => w.markers.forEach((m) => { m.visible = e.target.checked; })));
ui('ref').addEventListener('change', (e) => { capsule.visible = e.target.checked; });
ui('spin').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; });
addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target.tagName !== 'SELECT') { e.preventDefault(); togglePause(); }
});

// Hook for automated checks
window.wolfPreview = {
  pose(name, t) {
    if (!paused) togglePause();
    for (const w of wolves) {
      w.mixer.stopAllAction();
      w.current = null;
      startClip(w, name, 0);
      w.current.time = t;
      w.mixer.update(0);
    }
    clipName = name;
  },
  view(pos, target = [0, 0.6, 0]) {
    camera.position.set(...pos);
    controls.target.set(...target);
    controls.update();
  },
  get ready() { return wolves.length > 0; },
  get count() { return wolves.length; },
};

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  for (const w of wolves) w.mixer.update(paused ? 0 : dt);
  const cur = main.current;
  if (cur) {
    const d = cur.getClip().duration;
    ui('time').textContent = `${cur.time.toFixed(2)} / ${d.toFixed(2)} s`;
    if (!paused) ui('scrub').value = cur.time / d;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
